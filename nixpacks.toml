[phases.setup]
nixPkgs = ["...", "nodejs_20"]
aptPkgs = [
    "...",
    "libnss3",
    "libnspr4",
    "libatk1.0-0",
    "libatk-bridge2.0-0",
    "libcups2",
    "libdrm2",
    "libxkbcommon0",
    "libxcomposite1",
    "libxdamage1",
    "libxfixes3",
    "libxrandr2",
    "libgbm1",
    "libasound2",
]

[phases.install]
cmds = ["npm ci", "npx puppeteer browsers install chrome"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
