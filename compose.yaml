services:
  express-puppeteer:
    build: .
    container_name: express-puppeteer
    # Equivalent to Docker --init; enable it separately for Coolify/Nixpacks deployments.
    init: true
    # Must exceed drain + cleanup deadlines (55s with the defaults).
    stop_grace_period: ${SHUTDOWN_GRACE_PERIOD:-60s}
    ports:
      - "9000:8080"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - PDF_CONCURRENCY=${PDF_CONCURRENCY:-1}
      - PDF_MAX_PENDING=${PDF_MAX_PENDING:-2}
      - PDF_QUEUE_TIMEOUT_MS=${PDF_QUEUE_TIMEOUT_MS:-30000}
      - PROTOCOL_TIMEOUT_MS=${PROTOCOL_TIMEOUT_MS:-180000}
      - PDF_CONTENT_TIMEOUT_MS=${PDF_CONTENT_TIMEOUT_MS:-240000}
      - PDF_RENDER_TIMEOUT_MS=${PDF_RENDER_TIMEOUT_MS:-180000}
      - PDF_JOB_TIMEOUT_MS=${PDF_JOB_TIMEOUT_MS:-480000}
      - SHUTDOWN_DRAIN_TIMEOUT_MS=${SHUTDOWN_DRAIN_TIMEOUT_MS:-10000}
      - SHUTDOWN_CLEANUP_TIMEOUT_MS=${SHUTDOWN_CLEANUP_TIMEOUT_MS:-45000}
      - PDF_JSON_BODY_LIMIT=${PDF_JSON_BODY_LIMIT:-25mb}
    restart: always
